<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="discord-verification" content="819259da730b6965816ff38e9b78ec0c">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моё Портфолио</title>
    <style>
        /* Современные стили и переменные */
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            line-height: 1.6;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        /* Стильная шапка */
        header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }

        .avatar-placeholder {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border-radius: 50%;
            margin: 0 auto 20px;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0;
        }

        /* Блок проектов */
        h2 {
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .project-grid {
            display: grid;
            gap: 20px;
        }

        .project-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-4px);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .project-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .project-card p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
        }

        /* Кнопки контактов */
        footer {
            margin-top: 60px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 30px;
        }

        footer p {
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px var(--accent-glow);
            border-color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Шапка -->
        <header>
            <div class="avatar-placeholder"></div>
            <h1>Привет, я [Ваше Имя]</h1>
            <p>Frontend Разработчик / Создаю интерфейсы</p>
        </header>

        <!-- Проекты -->
        <main>
            <h2>Мои работы</h2>
            <div class="project-grid">
                <div class="project-card">
                    <h3>⚡ Мой первый сайт</h3>
                    <p>Это стильное портфолио, собранное своими руками. Использовал семантическую разметку HTML5 и современные свойства CSS3, включая CSS Variables и Flexbox.</p>
                </div>
            </div>
        </main>

        <!-- Контакты -->
        <footer>
            <p>Понравились работы? Напишите мне:</p>
            <div class="btn-group">
                <a href="https://t.me" class="btn">Telegram</a>
                <a href="mailto:example@mail.com" class="btn">Email</a>
            </div>
        </footer>
    </div>

</body>
</html>
